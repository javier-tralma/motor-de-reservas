name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  backend:
    name: Backend (Lint, Migrations, Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking_test_user
          POSTGRES_PASSWORD: booking_test_password
          POSTGRES_DB: booking_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      BUSINESS_ID: 00000000-0000-0000-0000-000000000001
      FRONTEND_URL: http://localhost:5173
      SESSION_SECRET: ci-test-session-secret-32-bytes-key
      RATE_LIMIT_SECRET: ci-test-rate-limit-secret-32-bytes
      EMAIL_PROVIDER: noop
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@127.0.0.1:5499/ci_placeholder_db
      TEST_DATABASE_URL: postgresql+psycopg://booking_test_user:booking_test_password@127.0.0.1:5433/booking_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Run Ruff linter
        working-directory: backend
        run: uv run ruff check .

      - name: Run Ruff formatter check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run Alembic migrations on clean PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://booking_test_user:booking_test_password@127.0.0.1:5433/booking_test
        run: uv run alembic upgrade head

      - name: Check for schema drift
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://booking_test_user:booking_test_password@127.0.0.1:5433/booking_test
        run: uv run alembic check

      - name: Run Pytest suite
        working-directory: backend
        run: PYTHONPATH=. uv run pytest -q

  frontend:
    name: Frontend (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Run Vite build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium with system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "Job Results:"
          echo "  - backend:  ${{ needs.backend.result }}"
          echo "  - frontend: ${{ needs.frontend.result }}"
          echo "  - e2e:      ${{ needs.e2e.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Error: One or more required CI jobs did not succeed." >&2
            exit 1
          fi
          echo "All required CI jobs succeeded."
